title: Chang's Data Lab
author: Chang Liu
logo: logo.png

latex:
  latex_documents:
    targetname: book.tex

bibtex_bibfiles:
  - references.bib

repository:
  url: https://github.com/Qsheep/data-lab
  path_to_book: .
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
  extra_css:
    - _static/custom.css

sphinx:
  extra_extensions:
    - sphinx_proof
    - sphinx_togglebutton

  config:

    suppress_warnings:
      - mystnb.unknown_mime_type

    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
      - plotly-responsive.js

    html_css_files:
      - custom.css


parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence

only_build_toc_files: true

execute:
  timeout: 200
  execute_notebooks: off

exclude_patterns:
  - _build
  - .venv
  - .venv/**
  - .env
  - Thumbs.db
  - .DS_Store
